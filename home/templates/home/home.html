{% extends 'base.html' %}
{% block title %}Menú{% endblock %}
{% block breadcrumb %}
  <a href="{% url 'home.home' %}">Inicio</a>
  <span>/</span>
{% endblock %}
{% load static %}

{% block content %}
<style>
  .quick-grid {
    margin-top: 0.5rem;
  }

  .quick-card {
    background: #fff;
    border: 1px solid #edf0f4;
    border-radius: 14px;
    box-shadow: 0 8px 18px rgba(31, 41, 55, 0.08);
    padding: 1.5rem 1rem;
    height: 100%;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
  }

  .quick-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(31, 41, 55, 0.12);
  }

  .quick-card i {
    font-size: 2.6rem;
    color: #50007D;
    display: block;
    line-height: 1;
  }

  .quick-card .btn {
    min-width: 200px;
    display: inline-block;
  }
</style>


<div class="container text-center">
  <div class="row g-3 quick-grid">

    <div class="col-md-4">
      <div class="quick-card">
        <i class="fas fa-user-graduate"></i>
        <a href="{% url 'students.student_list' %}" class="btn btn-primary btn-lg">Ver Estudiantes</a>
      </div>
    </div>

    <div class="col-md-4">
      <div class="quick-card">
        <i class="fas fa-chalkboard-teacher"></i>
        <a href="{% url 'tutors.tutors_list' %}" class="btn btn-primary btn-lg">Ver Tutores</a>
      </div>
    </div>

    <div class="col-md-4">
      <div class="quick-card">
        <i class="fas fa-calendar-alt"></i>
        <a href="{% url 'workshops:show_blocks' %}" class="btn btn-primary btn-lg">Ver Bloques</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
