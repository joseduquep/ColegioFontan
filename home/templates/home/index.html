{% extends 'base.html' %}
{% load static %}
{% block title %}Página principal{% endblock %}

{% block content %}
<style>
  .container-home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 220px);
    text-align: center;
    width: 100%;
    box-sizing: border-box;
    padding: 2rem 1rem;
  }

  .hero-card {
    width: min(760px, 100%);
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 16px 36px rgba(31, 41, 55, 0.12);
    padding: 2rem 1.5rem;
  }

  .logo {
    max-height: 180px;
    width: auto;
    margin-bottom: 1.2rem;
    display: block;
    margin-inline: auto;
  }

  .hero-title {
    font-size: clamp(2rem, 3vw, 3rem);
    font-weight: bold;
    color: #1f2937;
    margin-bottom: 0.75rem;
  }

  .hero-subtitle {
    color: #4b5563;
    margin-bottom: 1.5rem;
  }

  .btn-login-home {
    background-color: #00C8FF;
    color: white;
    padding: 0.85rem 1.5rem;
    border: none;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    transition: background-color 0.3s ease, transform 0.2s ease;
    cursor: pointer;
    display: inline-block;
  }

  .btn-login-home:hover {
    background-color: #00AACC;
    transform: translateY(-1px);
    color: white;
  }

  .btn-login-home:active {
    transform: translateY(0);
  }
</style>

<div class="container-home">
  <section class="hero-card">
    <img src="{% static 'images/logofontan.png' %}" alt="Colegio Fontán" class="logo">
    <h1 class="hero-title">Bienvenidos a Horarios Fontán</h1>
    <p class="hero-subtitle">Gestión académica de bloques, talleres, tutores y asistencia.</p>
    <a href="{% url 'accounts.login' %}" class="btn-login-home">Iniciar sesión</a>
  </section>
</div>
{% endblock %}
