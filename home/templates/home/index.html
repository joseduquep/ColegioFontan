{% extends 'base.html' %}
{% block title %}Página principal{% endblock %}

{% block content %}
<style>
  /* Reset márgenes/paddings de la página */
  body {
    margin: 0;
    padding: 0;
  }

  .container-home {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 120px); /* Ajustar según navbar/footer */
    text-align: center;
    width: 100%;
    box-sizing: border-box;
  }

  h1 {
    font-size: 3.5rem;
    font-weight: bold;
    color: #333;
    margin-bottom: 2rem;
  }

  /* Botón con Cyan Fontán */
  .btn-primary {
    background-color: #00C8FF; /* Cyan Fontán */
    color: white;
    padding: 15px 30px;
    border: none;
    border-radius: 8px;
    font-size: 1.8rem;
    font-weight: bold;
    text-decoration: none;
    transition: background-color 0.3s ease, transform 0.2s ease;
    cursor: pointer;
  }

  /* Hover más oscuro */
  .btn-primary:hover {
    background-color: #00AACC;
    transform: scale(1.05);
  }

  .btn-primary:active {
    transform: scale(1);
  }
</style>

<div class="container-home">
  <h1>Bienvenidos a Horarios Fontán</h1>
  <BR></BR>
  <a href="{% url 'accounts.login' %}" class="btn-primary">Iniciar Sesión</a>
</div>
{% endblock %}
